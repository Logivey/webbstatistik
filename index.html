<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Webbstatistik – Swede-Wheel & Hilfa</title>
<style>:root{--color-fg:#1d1d1b;--color-fg-muted:#6b6a65;--color-bg:#faf9f5;--color-panel:#fff;--color-border-line:#e6e3da;--color-ok:#1f7a4d;--color-warn:#b26b00;--color-bad:#c0392b;
--font-anthropic-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--font-anthropic-serif:Georgia,"Times New Roman",serif;
--cds-gap-xs:4px;--cds-gap-sm:8px;--cds-gap-md:16px;--cds-gap-lg:24px;--cds-pad-xs:4px;--cds-pad-sm:8px;--cds-pad-lg:20px;--cds-radius:10px;
--cds-font-size-caption:12px;--cds-font-size-body:14px;--cds-font-size-heading:16px;--cds-font-size-title:30px;--cds-font-weight-medium:600;
--cds-chart-grid:#eeece5;--cds-chart-axis:#cfccc2;--cds-chart-reference:#9a978d;--cds-surface-popover:#fff;--cds-border:#e6e3da;--cds-shadow-popover:0 2px 8px rgba(0,0,0,.1);--cds-text-secondary:#6b6a65;--cds-dur-slow:.3s}
@media (prefers-color-scheme: dark){:root{--color-fg:#ecebe6;--color-fg-muted:#a3a29b;--color-bg:#1c1c1a;--color-panel:#262624;--color-border-line:#3a3936;--color-ok:#5fc48e;--color-warn:#e0a24a;--color-bad:#ef7a6c;
--cds-chart-grid:#33322f;--cds-chart-axis:#4a4945;--cds-chart-reference:#7a7972;--cds-surface-popover:#2f2e2b;--cds-border:#3a3936;--cds-text-secondary:#a3a29b}}
html,body{margin:0;background:var(--color-bg);color:var(--color-fg);font-family:var(--font-anthropic-sans)}
#dash-root{padding:0 0 24px}
.dash-skeleton{color:transparent;background:linear-gradient(90deg,var(--color-border-line),var(--color-panel),var(--color-border-line));background-size:200% 100%;border-radius:6px;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}
.wrap{max-width:1240px;margin:0 auto;padding:28px 16px 40px;box-sizing:border-box}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:20px}
.top h1{font-family:var(--font-anthropic-serif);font-weight:400;font-size:30px;margin:0}
.top p{margin:4px 0 0;color:var(--color-fg-muted);font-size:13px}
.tabs{display:inline-flex;background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:999px;padding:4px;gap:4px}
.tabs button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--color-fg-muted);padding:8px 18px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--color-fg);color:var(--color-bg)}
iframe{display:block;width:100%;border:0;min-height:900px;background:transparent}
footer{margin-top:8px;font-size:12px;color:var(--color-fg-muted)}
</style></head><body>
<div class="wrap">
  <div class="top">
    <div><h1 id="title">Swede-Wheel</h1><p>Webbstatistik från Google Analytics. Uppdateras varje morgon.</p></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="swede-wheel" aria-selected="true">Swede-Wheel</button>
      <button role="tab" data-tab="hilfa" aria-selected="false">Hilfa</button>
    </div>
  </div>
  <iframe id="frame" title="Webbstatistik"></iframe>
  <footer>Källa: Google Analytics 4 via Windsor.ai. Bottrafik (en kanal en dag med minst 50 sessioner och under 10 % engagerade) är borträknad.</footer>
</div>
<script>
(function(){
  const frame = document.getElementById('frame');
  const tabs = [...document.querySelectorAll('[data-tab]')];
  const names = { 'swede-wheel': 'Swede-Wheel', 'hilfa': 'Hilfa' };
  let ro;
  const fit = () => { try { const d = frame.contentDocument; if (d && d.body) frame.style.height = d.documentElement.scrollHeight + 'px'; } catch (e) {} };
  frame.addEventListener('load', () => { fit(); try { if (ro) ro.disconnect(); ro = new ResizeObserver(fit); ro.observe(frame.contentDocument.body); } catch (e) {} });
  const show = (t) => {
    if (!names[t]) t = 'swede-wheel';
    tabs.forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
    document.getElementById('title').textContent = names[t];
    if (frame.dataset.tab !== t) { frame.dataset.tab = t; frame.src = t + '.html?v=' + Date.now(); }
    if (location.hash.slice(1) !== t) history.replaceState(null, '', '#' + t);
  };
  tabs.forEach((b) => b.addEventListener('click', () => show(b.dataset.tab)));
  show(location.hash.slice(1) || 'swede-wheel');
})();
</script>
</body></html>
